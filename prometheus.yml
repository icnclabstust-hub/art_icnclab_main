global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mcp-system'
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'chromadb'
    static_configs:
      - targets: ['chromadb:8000']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
