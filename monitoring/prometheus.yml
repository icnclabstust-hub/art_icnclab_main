# =============================================================================
# Prometheus 監控配置
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'art-history-database'
    environment: 'production'

# 告警規則
rule_files:
  - "/etc/prometheus/alerts/*.yml"

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 抓取配置
scrape_configs:
  # Prometheus 自身監控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 10s
    metrics_path: /metrics

  # Node Exporter - 系統監控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: /metrics

  # 藝術史資料庫主API
  - job_name: 'art-database-api'
    static_configs:
      - targets: ['art-database-api:3000']
    scrape_interval: 15s
    metrics_path: /metrics
    params:
      format: ['prometheus']

  # CUDA ML服務
  - job_name: 'cuda-ml-service'
    static_configs:
      - targets: ['cuda-ml-service:8080']
    scrape_interval: 15s
    metrics_path: /metrics
    params:
      format: ['prometheus']

  # PostgreSQL監控
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis監控
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Elasticsearch監控
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']
    scrape_interval: 30s

  # Nginx監控
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s

  # NVIDIA GPU監控 (如果有nvidia_gpu_exporter)
  - job_name: 'nvidia-gpu'
    static_configs:
      - targets: ['nvidia-gpu-exporter:9445']
    scrape_interval: 10s
    scrape_timeout: 8s

  # ChromaDB向量資料庫監控
  - job_name: 'chromadb'
    static_configs:
      - targets: ['chromadb:8000']
    metrics_path: /metrics
    scrape_interval: 30s

  # Neo4j圖資料庫監控
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:2004']
    metrics_path: /metrics
    scrape_interval: 30s

  # MLflow實驗追蹤監控
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    metrics_path: /metrics
    scrape_interval: 60s

  # Docker容器監控
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: /metrics

