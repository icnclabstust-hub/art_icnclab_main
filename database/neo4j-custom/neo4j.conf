# =============================================================================
# Neo4j 藝術史資料庫專用配置文件
# 預配置APOC和Graph Data Science插件設定
# =============================================================================

# 伺服器配置
server.default_listen_address=0.0.0.0
server.bolt.listen_address=:7687
server.http.listen_address=:7474

# 安全設定 - 允許APOC和GDS程序
dbms.security.procedures.unrestricted=apoc.*,gds.*
dbms.security.procedures.allowlist=apoc.*,gds.*

# APOC 配置
apoc.export.file.enabled=true
apoc.import.file.enabled=true
apoc.import.file.use_neo4j_config=true

# 記憶體配置
server.memory.heap.initial_size=1G
server.memory.heap.max_size=2G
server.memory.pagecache.size=1G

# 日誌配置
server.logs.user.level=INFO
server.logs.debug.level=INFO

# 交易配置
db.transaction.timeout=60s
db.transaction.concurrent.maximum=1000

# 網路配置
server.bolt.thread_pool_min_size=5
server.bolt.thread_pool_max_size=400

# GDS 特定配置
gds.enterprise.license_file=

# 效能調優
dbms.memory.transaction.total.max=1G
dbms.connector.bolt.thread_pool_min_size=5
dbms.connector.bolt.thread_pool_max_size=400

# 查詢快取
dbms.query_cache_size=1000

# 禁用匿名使用統計
dbms.usage_report.enabled=false

# 允許從任何主機連接（開發環境）
server.default_advertised_address=0.0.0.0

# 備份配置
dbms.backup.enabled=true