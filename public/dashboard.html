<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藝術史資料庫 - Agent 監控儀表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .dashboard {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-healthy { background-color: #2ecc71; }
        .status-warning { background-color: #f39c12; }
        .status-error { background-color: #e74c3c; }
        .status-loading { background-color: #95a5a6; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .agent-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }

        .agent-card.error {
            border-left-color: #e74c3c;
        }

        .agent-card.warning {
            border-left-color: #f39c12;
        }

        .agent-card.success {
            border-left-color: #2ecc71;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .metric-value {
            font-weight: bold;
            color: #2980b9;
        }

        .workflow-progress {
            width: 100%;
            height: 8px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .workflow-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            transition: width 0.3s ease;
        }

        .log-container {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-timestamp {
            color: #95a5a6;
        }

        .log-level-info { color: #3498db; }
        .log-level-warn { color: #f39c12; }
        .log-level-error { color: #e74c3c; }
        .log-level-success { color: #2ecc71; }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn.success {
            background: #2ecc71;
        }

        .btn.success:hover {
            background: #27ae60;
        }

        .btn.danger {
            background: #e74c3c;
        }

        .btn.danger:hover {
            background: #c0392b;
        }

        .btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .data-flow-diagram {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .flow-step {
            background: #3498db;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            margin: 0 10px;
            position: relative;
            min-width: 120px;
            text-align: center;
        }

        .flow-step.active {
            background: #2ecc71;
            animation: pulse 2s infinite;
        }

        .flow-step.error {
            background: #e74c3c;
        }

        .flow-arrow {
            width: 0;
            height: 0;
            border-left: 10px solid #3498db;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        .refresh-indicator {
            display: inline-block;
            margin-left: 10px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .error-item {
            padding: 8px;
            margin-bottom: 5px;
            background: #fdf2f2;
            border-left: 3px solid #e74c3c;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🎨 藝術史資料庫 Agent 監控儀表板</h1>
            <p>
                <span class="status-indicator" id="systemStatus"></span>
                系統狀態: <span id="systemStatusText">連接中...</span>
                <span class="refresh-indicator" id="refreshIndicator" style="display:none;">⟳</span>
            </p>
        </div>

        <div class="controls">
            <h3>🎮 控制面板</h3>
            <div>
                <button class="btn success" onclick="executeWorkflow('fullPipeline')">
                    🚀 執行完整管線
                </button>
                <button class="btn" onclick="executeWorkflow('processExisting')">
                    📊 處理現有資料
                </button>
                <button class="btn" onclick="executeWorkflow('crawlOnly')">
                    🕷️ 僅爬取資料
                </button>
                <button class="btn" onclick="refreshAll()">
                    🔄 刷新狀態
                </button>
                <button class="btn danger" onclick="restartAllAgents()">
                    ⚡ 重啟所有 Agents
                </button>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>📊 系統統計</h3>
                <div class="stats-grid" id="systemStats">
                    <div class="stat-card">
                        <div class="stat-value" id="totalTasks">-</div>
                        <div class="stat-label">總任務數</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="completedTasks">-</div>
                        <div class="stat-label">已完成</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="failedTasks">-</div>
                        <div class="stat-label">失敗任務</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="successRate">-</div>
                        <div class="stat-label">成功率</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>⚡ 當前工作流程</h3>
                <div id="currentWorkflow">
                    <p id="workflowStatus">無運行中的工作流程</p>
                    <div class="workflow-progress">
                        <div class="workflow-progress-bar" id="workflowProgressBar" style="width: 0%"></div>
                    </div>
                    <p id="workflowProgress">0/0 步驟完成</p>
                </div>
            </div>

            <div class="card">
                <h3>🔍 數據流程</h3>
                <div class="data-flow-diagram" id="dataFlowDiagram">
                    <div class="flow-step" id="step-crawl">爬取</div>
                    <div class="flow-arrow"></div>
                    <div class="flow-step" id="step-extract">提取</div>
                    <div class="flow-arrow"></div>
                    <div class="flow-step" id="step-classify">分類</div>
                    <div class="flow-arrow"></div>
                    <div class="flow-step" id="step-process">處理</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>🤖 Agent 狀態</h3>
            <div class="agent-grid" id="agentGrid">
                <!-- Agent 卡片將在這裡動態生成 -->
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>📝 系統日誌</h3>
                <div class="log-container" id="systemLogs">
                    <div class="log-entry">
                        <span class="log-timestamp">--:--:--</span>
                        <span class="log-level-info">[INFO]</span>
                        等待系統連接...
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>❌ 錯誤報告</h3>
                <div class="error-list" id="errorList">
                    <p style="color: #7f8c8d; text-align: center;">目前沒有錯誤</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let updateInterval;
        let isConnected = false;
        let currentData = {};

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 監控儀表板已載入');
            startDashboard();
        });

        function startDashboard() {
            updateSystemStatus('loading', '連接中...');
            refreshAll();

            // 設定自動更新
            updateInterval = setInterval(refreshAll, 5000);
        }

        function updateSystemStatus(status, text) {
            const indicator = document.getElementById('systemStatus');
            const statusText = document.getElementById('systemStatusText');

            indicator.className = `status-indicator status-${status}`;
            statusText.textContent = text;
            isConnected = status === 'healthy';
        }

        async function refreshAll() {
            showRefreshIndicator(true);

            try {
                await Promise.all([
                    updateAgentStatus(),
                    updateSystemStats(),
                    updateDataFlow(),
                    updateSystemLogs()
                ]);

                updateSystemStatus('healthy', '系統運行正常');
                addLog('info', '狀態更新完成');
            } catch (error) {
                console.error('刷新失敗:', error);
                updateSystemStatus('error', '連接失敗');
                addLog('error', `狀態更新失敗: ${error.message}`);
            }

            showRefreshIndicator(false);
        }

        function showRefreshIndicator(show) {
            document.getElementById('refreshIndicator').style.display = show ? 'inline-block' : 'none';
        }

        async function updateAgentStatus() {
            try {
                const response = await fetch('/api/v1/agents/status');
                const data = await response.json();

                if (data.success) {
                    renderAgentCards(data.data);
                    currentData.agents = data.data;
                }
            } catch (error) {
                console.error('更新 Agent 狀態失敗:', error);
            }
        }

        async function updateSystemStats() {
            try {
                const response = await fetch('/api/v1/agents/statistics');
                const data = await response.json();

                if (data.success) {
                    renderSystemStats(data.data);
                    currentData.statistics = data.data;
                }
            } catch (error) {
                console.error('更新系統統計失敗:', error);
            }
        }

        async function updateDataFlow() {
            try {
                const response = await fetch('/api/v1/agents/data/flow');
                const data = await response.json();

                if (data.success) {
                    renderDataFlow(data.data);
                    currentData.dataFlow = data.data;
                }
            } catch (error) {
                console.error('更新數據流程失敗:', error);
            }
        }

        function renderAgentCards(agentData) {
            const container = document.getElementById('agentGrid');
            container.innerHTML = '';

            if (agentData.agents) {
                Object.entries(agentData.agents).forEach(([name, agent]) => {
                    const statusClass = getStatusClass(agent.status);
                    const card = document.createElement('div');
                    card.className = `agent-card ${statusClass}`;
                    card.innerHTML = `
                        <h4>🤖 ${agent.name || name}</h4>
                        <div class="metric">
                            <span>狀態:</span>
                            <span class="metric-value">${agent.status}</span>
                        </div>
                        <div class="metric">
                            <span>完成任務:</span>
                            <span class="metric-value">${agent.statistics?.tasksCompleted || 0}</span>
                        </div>
                        <div class="metric">
                            <span>進行中:</span>
                            <span class="metric-value">${agent.statistics?.tasksInProgress || 0}</span>
                        </div>
                        <div class="metric">
                            <span>錯誤數:</span>
                            <span class="metric-value">${agent.statistics?.errors || 0}</span>
                        </div>
                        <div class="metric">
                            <span>最後活動:</span>
                            <span class="metric-value">${formatTime(agent.lastActivity)}</span>
                        </div>
                        <button class="btn" onclick="restartAgent('${name}')" style="width: 100%; margin-top: 10px;">
                            🔄 重啟
                        </button>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function renderSystemStats(stats) {
            if (stats.hub) {
                document.getElementById('totalTasks').textContent = stats.hub.statistics?.totalTasks || 0;
                document.getElementById('completedTasks').textContent = stats.hub.statistics?.completedTasks || 0;
                document.getElementById('failedTasks').textContent = stats.hub.statistics?.failedTasks || 0;

                const total = stats.hub.statistics?.totalTasks || 0;
                const completed = stats.hub.statistics?.completedTasks || 0;
                const rate = total > 0 ? Math.round((completed / total) * 100) : 0;
                document.getElementById('successRate').textContent = `${rate}%`;
            }
        }

        function renderDataFlow(flowData) {
            // 重置所有步驟狀態
            ['crawl', 'extract', 'classify', 'process'].forEach(step => {
                const element = document.getElementById(`step-${step}`);
                element.className = 'flow-step';
            });

            // 根據流程數據更新狀態
            if (flowData.stages) {
                Object.entries(flowData.stages).forEach(([stage, info]) => {
                    let stepId = '';
                    switch (stage) {
                        case 'raw': stepId = 'crawl'; break;
                        case 'processed': stepId = 'extract'; break;
                        case 'classified': stepId = 'classify'; break;
                        case 'final': stepId = 'process'; break;
                    }

                    if (stepId) {
                        const element = document.getElementById(`step-${stepId}`);
                        if (info.fileCount > 0) {
                            element.className = 'flow-step active';
                        }
                    }
                });
            }
        }

        function updateSystemLogs() {
            // 這裡可以從 API 獲取實際的日誌數據
            // 現在使用模擬數據
            addLog('info', '系統狀態檢查完成');
        }

        function addLog(level, message) {
            const container = document.getElementById('systemLogs');
            const timestamp = new Date().toLocaleTimeString();

            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `
                <span class="log-timestamp">[${timestamp}]</span>
                <span class="log-level-${level}">[${level.toUpperCase()}]</span>
                ${message}
            `;

            container.appendChild(logEntry);
            container.scrollTop = container.scrollHeight;

            // 限制日誌數量
            while (container.children.length > 50) {
                container.removeChild(container.firstChild);
            }
        }

        async function executeWorkflow(workflowName) {
            try {
                addLog('info', `開始執行工作流程: ${workflowName}`);

                const response = await fetch(`/api/v1/agents/workflows/${workflowName}/execute`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });

                const result = await response.json();

                if (result.success) {
                    addLog('success', `工作流程 ${workflowName} 開始執行`);
                    updateWorkflowProgress(workflowName, 'executing');
                } else {
                    addLog('error', `工作流程執行失敗: ${result.error}`);
                }
            } catch (error) {
                console.error('執行工作流程失敗:', error);
                addLog('error', `工作流程執行失敗: ${error.message}`);
            }
        }

        async function restartAgent(agentName) {
            try {
                addLog('info', `重啟 Agent: ${agentName}`);

                const response = await fetch(`/api/v1/agents/${agentName}/restart`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (result.success) {
                    addLog('success', `Agent ${agentName} 重啟成功`);
                } else {
                    addLog('error', `Agent 重啟失敗: ${result.error}`);
                }

                // 刷新狀態
                setTimeout(refreshAll, 1000);
            } catch (error) {
                console.error('重啟 Agent 失敗:', error);
                addLog('error', `Agent 重啟失敗: ${error.message}`);
            }
        }

        async function restartAllAgents() {
            const agents = ['webCrawler', 'metadataExtractor', 'classification', 'summarizationTranslation'];

            for (const agent of agents) {
                await restartAgent(agent);
                await new Promise(resolve => setTimeout(resolve, 1000)); // 等待1秒
            }
        }

        function updateWorkflowProgress(workflowName, status) {
            const statusElement = document.getElementById('workflowStatus');
            statusElement.textContent = `${workflowName} - ${status}`;

            if (status === 'executing') {
                document.getElementById('workflowProgressBar').style.width = '25%';
                document.getElementById('workflowProgress').textContent = '執行中...';
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'ready':
                case 'completed':
                    return 'success';
                case 'error':
                case 'failed':
                    return 'error';
                case 'initializing':
                case 'running':
                    return 'warning';
                default:
                    return '';
            }
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleTimeString();
        }

        // 清理
        window.addEventListener('beforeunload', function() {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
</html>
