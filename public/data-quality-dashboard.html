<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料品質監控儀表板 - 藝術史資料庫</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .status-indicator.online {
            background: #28a745;
            animation: pulse 2s infinite;
        }

        .status-indicator.offline {
            background: #dc3545;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #1e7e34;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .main-content {
            padding: 30px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #3498db;
            transition: transform 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .metric-title {
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: 600;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .metric-grade {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .grade-A { background: #28a745; }
        .grade-B { background: #17a2b8; }
        .grade-C { background: #ffc107; color: #212529; }
        .grade-D { background: #fd7e14; }
        .grade-F { background: #dc3545; }

        .metric-trend {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .trend-icon {
            width: 0;
            height: 0;
        }

        .trend-up {
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 8px solid #28a745;
        }

        .trend-down {
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 8px solid #dc3545;
        }

        .trend-stable {
            width: 10px;
            height: 2px;
            background: #6c757d;
        }

        .charts-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }

        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .issues-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .issues-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .issue-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            background: #f8f9fa;
            border-left: 4px solid #ffc107;
        }

        .recommendation-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            background: #e8f5e8;
            border-left: 4px solid #28a745;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 1.2rem;
            color: #6c757d;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
        }

        .last-updated {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            padding: 20px;
            border-top: 1px solid #dee2e6;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                margin: 10px;
                border-radius: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .status-bar {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .main-content {
                padding: 20px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .issues-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>資料品質監控儀表板</h1>
            <p>藝術史資料庫品質管理系統 - 即時監控資料完整性與準確性</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">載入中...</span>
            </div>
            <div class="controls">
                <button class="btn btn-primary" onclick="refreshDashboard()">刷新</button>
                <button class="btn btn-success" id="startBtn" onclick="startMonitoring()">啟動監控</button>
                <button class="btn btn-danger" id="stopBtn" onclick="stopMonitoring()">停止監控</button>
                <button class="btn btn-primary" onclick="triggerEvaluation()">執行評估</button>
            </div>
        </div>

        <div class="main-content">
            <!-- 品質指標卡片 -->
            <div class="metrics-grid" id="metricsGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    載入品質指標中...
                </div>
            </div>

            <!-- 趨勢圖表 -->
            <div class="charts-section">
                <h2 class="section-title">品質趨勢分析</h2>
                <div class="chart-container">
                    <canvas id="trendChart" width="400" height="200"></canvas>
                </div>
            </div>

            <!-- 問題與建議 -->
            <div class="issues-section">
                <div class="issues-card">
                    <h3 class="section-title">主要品質問題</h3>
                    <div id="issuesList">
                        <div class="loading">
                            <div class="spinner"></div>
                            載入問題清單...
                        </div>
                    </div>
                </div>
                <div class="issues-card">
                    <h3 class="section-title">改善建議</h3>
                    <div id="recommendationsList">
                        <div class="loading">
                            <div class="spinner"></div>
                            載入建議清單...
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="last-updated" id="lastUpdated">
            最後更新: 載入中...
        </div>
    </div>

    <script>
        let chart = null;

        // 初始化儀表板
        async function initDashboard() {
            try {
                await loadDashboardData();
                setInterval(loadDashboardData, 60000); // 每分鐘自動更新
            } catch (error) {
                console.error('初始化失敗:', error);
                showError('儀表板初始化失敗: ' + error.message);
            }
        }

        // 載入儀表板數據
        async function loadDashboardData() {
            try {
                const response = await fetch('/api/v1/data-quality/dashboard');
                const data = await response.json();

                if (data.success) {
                    updateStatus(data.data.status);
                    updateMetrics(data.data);
                    updateChart(data.data.trends);
                    updateIssuesAndRecommendations(data.data);
                    updateLastUpdated();
                } else {
                    throw new Error(data.message || '載入數據失敗');
                }
            } catch (error) {
                console.error('載入數據失敗:', error);
                showError('載入數據失敗: ' + error.message);
            }
        }

        // 更新狀態顯示
        function updateStatus(status) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');

            if (status.isMonitoring) {
                indicator.className = 'status-indicator online';
                text.textContent = '監控中';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';
            } else {
                indicator.className = 'status-indicator offline';
                text.textContent = '已停止';
                startBtn.style.display = 'inline-block';
                stopBtn.style.display = 'none';
            }
        }

        // 更新品質指標卡片
        function updateMetrics(data) {
            const container = document.getElementById('metricsGrid');

            if (!data.currentQuality) {
                container.innerHTML = '<div class="loading">暫無品質數據</div>';
                return;
            }

            const metrics = [
                {
                    title: '整體品質評分',
                    value: data.currentQuality.overallScore,
                    grade: data.currentQuality.grade,
                    trend: data.trends.overall?.trend || 'stable'
                },
                {
                    title: '完整性',
                    value: data.trends.completeness?.latest || 0,
                    trend: data.trends.completeness?.trend || 'stable'
                },
                {
                    title: '準確性',
                    value: data.trends.accuracy?.latest || 0,
                    trend: data.trends.accuracy?.trend || 'stable'
                },
                {
                    title: '一致性',
                    value: data.trends.consistency?.latest || 0,
                    trend: data.trends.consistency?.trend || 'stable'
                },
                {
                    title: '時效性',
                    value: data.trends.freshness?.latest || 0,
                    trend: data.trends.freshness?.trend || 'stable'
                },
                {
                    title: '有效性',
                    value: data.trends.validity?.latest || 0,
                    trend: data.trends.validity?.trend || 'stable'
                }
            ];

            container.innerHTML = metrics.map(metric => createMetricCard(metric)).join('');
        }

        // 創建指標卡片HTML
        function createMetricCard(metric) {
            const percentage = Math.round(metric.value * 100);
            const trendIcon = getTrendIcon(metric.trend);
            const gradeClass = metric.grade ? `grade-${metric.grade}` : '';

            return `
                <div class="metric-card">
                    <div class="metric-header">
                        <div class="metric-title">${metric.title}</div>
                        ${metric.grade ? `<span class="metric-grade ${gradeClass}">${metric.grade}</span>` : ''}
                    </div>
                    <div class="metric-value" style="color: ${getScoreColor(metric.value)}">${percentage}%</div>
                    <div class="metric-trend">
                        <div class="trend-icon trend-${metric.trend}"></div>
                        <span>${getTrendText(metric.trend)}</span>
                    </div>
                </div>
            `;
        }

        // 獲取分數顏色
        function getScoreColor(score) {
            if (score >= 0.9) return '#28a745';
            if (score >= 0.8) return '#17a2b8';
            if (score >= 0.7) return '#ffc107';
            if (score >= 0.6) return '#fd7e14';
            return '#dc3545';
        }

        // 獲取趨勢圖標
        function getTrendIcon(trend) {
            return `<div class="trend-icon trend-${trend}"></div>`;
        }

        // 獲取趨勢文字
        function getTrendText(trend) {
            switch (trend) {
                case 'improving': return '改善中';
                case 'declining': return '下降中';
                case 'stable': return '穩定';
                default: return '未知';
            }
        }

        // 更新趨勢圖表
        function updateChart(trends) {
            const ctx = document.getElementById('trendChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            const labels = ['整體品質', '完整性', '準確性', '一致性', '時效性', '有效性'];
            const data = [
                trends.overall?.latest || 0,
                trends.completeness?.latest || 0,
                trends.accuracy?.latest || 0,
                trends.consistency?.latest || 0,
                trends.freshness?.latest || 0,
                trends.validity?.latest || 0
            ].map(v => Math.round(v * 100));

            chart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '品質指標',
                        data: data,
                        backgroundColor: 'rgba(52, 152, 219, 0.2)',
                        borderColor: 'rgba(52, 152, 219, 1)',
                        pointBackgroundColor: 'rgba(52, 152, 219, 1)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgba(52, 152, 219, 1)'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        r: {
                            angleLines: {
                                display: false
                            },
                            suggestedMin: 0,
                            suggestedMax: 100
                        }
                    }
                }
            });
        }

        // 更新問題與建議
        function updateIssuesAndRecommendations(data) {
            const issuesList = document.getElementById('issuesList');
            const recommendationsList = document.getElementById('recommendationsList');

            // 更新問題清單
            if (data.topIssues && data.topIssues.length > 0) {
                issuesList.innerHTML = data.topIssues.map(issue =>
                    `<div class="issue-item">
                        <strong>${issue.metric}</strong>: ${Math.round(issue.score * 100)}%
                    </div>`
                ).join('');
            } else {
                issuesList.innerHTML = '<div class="issue-item">暫無重要問題</div>';
            }

            // 更新建議清單
            if (data.recommendations && data.recommendations.length > 0) {
                recommendationsList.innerHTML = data.recommendations.map(rec =>
                    `<div class="recommendation-item">${rec}</div>`
                ).join('');
            } else {
                recommendationsList.innerHTML = '<div class="recommendation-item">暫無改善建議</div>';
            }
        }

        // 更新最後更新時間
        function updateLastUpdated() {
            document.getElementById('lastUpdated').textContent =
                `最後更新: ${new Date().toLocaleString('zh-TW')}`;
        }

        // 刷新儀表板
        function refreshDashboard() {
            loadDashboardData();
        }

        // 啟動監控
        async function startMonitoring() {
            try {
                const response = await fetch('/api/v1/data-quality/start', {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    await loadDashboardData();
                } else {
                    showError('啟動監控失敗: ' + data.message);
                }
            } catch (error) {
                showError('啟動監控失敗: ' + error.message);
            }
        }

        // 停止監控
        async function stopMonitoring() {
            try {
                const response = await fetch('/api/v1/data-quality/stop', {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    await loadDashboardData();
                } else {
                    showError('停止監控失敗: ' + data.message);
                }
            } catch (error) {
                showError('停止監控失敗: ' + error.message);
            }
        }

        // 觸發評估
        async function triggerEvaluation() {
            try {
                const response = await fetch('/api/v1/data-quality/evaluate', {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    await loadDashboardData();
                } else {
                    showError('執行評估失敗: ' + data.message);
                }
            } catch (error) {
                showError('執行評估失敗: ' + error.message);
            }
        }

        // 顯示錯誤信息
        function showError(message) {
            const container = document.getElementById('metricsGrid');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        // 頁面載入時初始化
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
